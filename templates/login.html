{% load static %}
<!doctype html>
<html lang="{{ lang_code|default:'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="auth_login_page_title">Login - WealthFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="{% static 'css/authentication/auth.css' %}" rel="stylesheet" />
    <link href="{% static 'css/authentication/forms.css' %}" rel="stylesheet" />
    <link href="{% static 'css/authentication/animations.css' %}" rel="stylesheet" />
    <link href="{% static 'css/authentication/responsive.css' %}" rel="stylesheet" />
  </head>
  <body class="auth-page">
    <div class="auth-card" si-modern-card>
      <div class="auth-lang">
        <select id="authLanguageSelect" aria-label="Language selector">
          <option value="en">English</option>
          <option value="ar">العربية</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
        <button class="icon-btn" id="theme-toggle" type="button" onclick="WFAuth.toggleTheme()" aria-label="Toggle theme">🌙</button>
      </div>
      <div class="auth-logo">
        <div class="logo-icon">
          <svg width="34" height="34" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" stroke="url(#wfLogoGradLogin)" stroke-width="2.5" fill="rgba(37, 99, 235, 0.12)"/>
            <path d="M9 21L14 14.5L17.5 17.5L23 10.5" stroke="url(#wfLogoGradLogin)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="23" cy="10.5" r="2" fill="#3b82f6"/>
            <defs>
              <linearGradient id="wfLogoGradLogin" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop stop-color="#3b82f6"/>
                <stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 data-i18n="auth_brand_name">WealthFlow</h1>
        <p data-i18n="auth_login_subtitle">Sign in to your account</p>
      </div>

      {% if error_key %}
      <div class="alert-dark-danger" role="alert">
        <i class="bi bi-exclamation-circle"></i>
        <span data-i18n="{{ error_key }}">{{ error_key }}</span>
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="lang" value="{{ lang_code|default:'en' }}" class="lang-hidden-input" />
        <div class="mb-form">
          <label class="form-label" for="loginUsernameInput" data-i18n="auth_username_label">Username</label>
          <input
            type="text"
            name="username"
            id="loginUsernameInput"
            class="form-control"
            data-i18n-placeholder="auth_username_placeholder"
            placeholder="Enter your username"
            value="{{ prefill_username|default:'' }}"
            autocomplete="username"
            required
            tabindex="1"
          />
        </div>
        <div class="mb-form">
          <label class="form-label" for="passwordInput" data-i18n="auth_password_label">Password</label>
          <div class="input-group">
            <input
              type="password"
              name="password"
              id="passwordInput"
              class="form-control"
              data-i18n-placeholder="auth_password_placeholder"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              tabindex="2"
            />
            <button type="button" class="btn-eye" onclick="WFAuth.togglePassword('passwordInput', 'eyeIcon')" aria-label="Toggle password visibility" tabindex="-1">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
          <div id="capsLockWarning" class="caps-lock-warning d-none" role="status">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span data-i18n="auth_caps_lock_on">Caps Lock is ON</span>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="rememberMe" name="remember_me" tabindex="3">
            <label class="form-check-label" for="rememberMe" data-i18n="auth_remember_me" style="font-size: 12px; cursor: pointer; color: var(--wf-auth-text-secondary);">Remember Me</label>
          </div>
          <a href="/accounts/forgot-password/" class="auth-footer-link" style="font-size: 12px; color: var(--wf-auth-accent); text-decoration: none; font-weight: 600;" data-i18n="auth_forgot_password_button" tabindex="4">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-submit" tabindex="5">
          <i class="bi bi-box-arrow-in-right"></i>
          <span data-i18n="auth_login_button">Sign In</span>
        </button>
      </form>

      <hr class="auth-divider" />
      <div class="auth-footer">
        <span data-i18n="auth_login_no_account">Don't have an account?</span>
        <a href="/accounts/signup/" data-i18n="auth_create_account_link" tabindex="6">Create one</a>
      </div>
    </div>

    <script src="{% static 'js/authentication/shared.js' %}"></script>
    <script src="{% static 'js/authentication/login.js' %}"></script>
  </body>
</html>
