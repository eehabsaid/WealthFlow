{% load static %}
<!doctype html>
<html lang="{{ lang_code|default:'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="auth_login_page_title">Login - WealthFlow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #070d1f;
        --bg-secondary: #0c1428;
        --bg-tertiary: #101c38;
        --border-color: #1a3460;
        --accent: #1a6ef5;
        --accent-hover: #3381ff;
        --accent-glow: rgba(26, 110, 245, 0.25);
        --text-primary: #dce8ff;
        --text-secondary: #7b97cc;
        --text-muted: #3f5a8a;
        --accent-red: #ff4d6d;
        --accent-green: #00d68f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .auth-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 40px 36px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .auth-logo {
        text-align: center;
        margin-bottom: 28px;
      }
      .auth-logo .logo-icon {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, var(--accent), #0f45c8);
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin-bottom: 12px;
        box-shadow: 0 0 20px var(--accent-glow);
      }
      .auth-logo h1 {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 4px;
      }
      .auth-logo p {
        font-size: 13px;
        color: var(--text-muted);
      }
      .form-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .form-control {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .form-control::placeholder {
        color: var(--text-muted);
      }
      .form-control:focus {
        background: var(--bg-tertiary);
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
        color: var(--text-primary);
        outline: none;
      }
      .input-group .form-control {
        border-radius: 8px 0 0 8px;
      }
      .input-group .btn-eye {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-left: none;
        color: var(--text-muted);
        border-radius: 0 8px 8px 0;
        padding: 0 14px;
        cursor: pointer;
        transition: color 0.15s;
      }
      .input-group .btn-eye:hover {
        color: var(--text-primary);
      }
      .btn-submit {
        width: 100%;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.15s,
          box-shadow 0.15s;
        margin-top: 8px;
      }
      .btn-submit:hover {
        background: var(--accent-hover);
        box-shadow: 0 0 16px var(--accent-glow);
      }
      .auth-divider {
        border: none;
        border-top: 1px solid var(--border-color);
        margin: 24px 0;
      }
      .auth-footer {
        text-align: center;
        font-size: 13px;
        color: var(--text-muted);
      }
      .auth-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .auth-footer a:hover {
        color: var(--accent-hover);
      }
      .alert-dark-danger {
        background: rgba(255, 77, 109, 0.1);
        border: 1px solid rgba(255, 77, 109, 0.35);
        color: #ff8099;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mb-form {
        margin-bottom: 18px;
      }
      .auth-lang {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 18px;
      }
      .auth-lang select {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-lang">
        <select id="authLanguageSelect" aria-label="Language selector">
          <option value="en">English</option>
          <option value="ar">العربية</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <div class="auth-logo">
        <div class="logo-icon">💰</div>
        <h1 data-i18n="auth_brand_name">WealthFlow</h1>
        <p data-i18n="auth_login_subtitle">Sign in to your account</p>
      </div>

      {% if error_key %}
      <div class="alert-dark-danger">
        <i class="bi bi-exclamation-circle"></i>
        <span data-i18n="{{ error_key }}">{{ error_key }}</span>
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="lang" value="{{ lang_code|default:'en' }}" class="lang-hidden-input" />
        <div class="mb-form">
          <label class="form-label" data-i18n="auth_username_label">Username</label>
          <input
            type="text"
            name="username"
            class="form-control"
            data-i18n-placeholder="auth_username_placeholder"
            placeholder="Enter your username"
            value="{{ prefill_username|default:'' }}"
            required
            autofocus
          />
        </div>
        <div class="mb-form">
          <label class="form-label" data-i18n="auth_password_label">Password</label>
          <div class="input-group">
            <input
              type="password"
              name="password"
              id="passwordInput"
              class="form-control"
              data-i18n-placeholder="auth_password_placeholder"
              placeholder="Enter your password"
              required
            />
            <button type="button" class="btn-eye" onclick="togglePassword()">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit">
          <i class="bi bi-box-arrow-in-right"></i>
          <span data-i18n="auth_login_button">Sign In</span>
        </button>
      </form>

      <div class="auth-footer" style="margin-top: 16px">
        <a href="/accounts/forgot-password/" data-i18n="auth_forgot_password_button">Forgot Password</a>
      </div>

      <hr class="auth-divider" />
      <div class="auth-footer">
        <span data-i18n="auth_login_no_account">Don't have an account?</span>
        <a href="/accounts/signup/" data-i18n="auth_create_account_link">Create one</a>
      </div>
    </div>

    <script src="{% static 'js/auth_i18n.js' %}"></script>
    <script>
      function togglePassword() {
        const inp = document.getElementById("passwordInput");
        const icon = document.getElementById("eyeIcon");
        if (inp.type === "password") {
          inp.type = "text";
          icon.className = "bi bi-eye-slash";
        } else {
          inp.type = "password";
          icon.className = "bi bi-eye";
        }
      }
    </script>
  </body>
</html>
