{% load static %}
<!doctype html>
<html lang="{{ lang_code|default:'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="auth_forgot_password_page_title">Forgot Password - WealthFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
      :root { --bg-primary:#070d1f; --bg-secondary:#0c1428; --bg-tertiary:#101c38; --border-color:#1a3460; --accent:#1a6ef5; --accent-hover:#3381ff; --accent-glow:rgba(26,110,245,.25); --text-primary:#dce8ff; --text-secondary:#7b97cc; --text-muted:#3f5a8a; --accent-red:#ff4d6d; --accent-green:#00d68f; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { background:var(--bg-primary); color:var(--text-primary); font-family:"Segoe UI",system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
      .auth-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:16px; padding:40px 36px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
      .auth-lang { display:flex; justify-content:flex-end; margin-bottom:18px; }
      .auth-lang select, .form-control { background:var(--bg-tertiary); border:1px solid var(--border-color); color:var(--text-primary); border-radius:8px; }
      .auth-lang select { padding:8px 12px; font-size:13px; }
      .auth-logo { text-align:center; margin-bottom:28px; }
      .auth-logo .logo-icon { width:56px; height:56px; background:linear-gradient(135deg,var(--accent),#0f45c8); border-radius:14px; display:inline-flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:12px; box-shadow:0 0 20px var(--accent-glow); }
      .auth-logo h1 { font-size:20px; font-weight:700; margin-bottom:4px; }
      .auth-logo p { font-size:13px; color:var(--text-muted); }
      .form-label { font-size:12px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
      .form-control { padding:10px 14px; font-size:14px; }
      .btn-submit { width:100%; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:11px; font-size:14px; font-weight:700; margin-top:8px; }
      .btn-submit:hover { background:var(--accent-hover); box-shadow:0 0 16px var(--accent-glow); }
      .alert-dark-danger, .alert-dark-success { border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:18px; display:flex; align-items:center; gap:8px; }
      .alert-dark-danger { background:rgba(255,77,109,.1); border:1px solid rgba(255,77,109,.35); color:#ff8099; }
      .alert-dark-success { background:rgba(0,214,143,.1); border:1px solid rgba(0,214,143,.35); color:#7ef2c6; }
      .auth-footer { text-align:center; font-size:13px; color:var(--text-muted); margin-top:18px; }
      .auth-footer a { color:var(--accent); text-decoration:none; font-weight:600; }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-lang">
        <select id="authLanguageSelect" aria-label="Language selector">
          <option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="de">Deutsch</option>
        </select>
      </div>
      <div class="auth-logo">
        <div class="logo-icon">💰</div>
        <h1 data-i18n="auth_forgot_password_heading">Forgot Password</h1>
        <p data-i18n="auth_forgot_password_subtitle">We will send you a reset link.</p>
      </div>
      {% if error_key %}<div class="alert-dark-danger"><i class="bi bi-exclamation-circle"></i><span data-i18n="{{ error_key }}">{{ error_key }}</span></div>{% endif %}
      {% if success_key %}<div class="alert-dark-success"><i class="bi bi-check-circle"></i><span data-i18n="{{ success_key }}">{{ success_key }}</span></div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="lang" value="{{ lang_code|default:'en' }}" class="lang-hidden-input" />
        <label class="form-label" data-i18n="auth_email_label">Email</label>
        <input type="email" name="email" class="form-control" data-i18n-placeholder="auth_email_placeholder" placeholder="your@email.com" value="{{ prefill_email|default:'' }}" required />
        <button type="submit" class="btn-submit"><i class="bi bi-envelope"></i> <span data-i18n="auth_send_reset_link_button">Send Reset Link</span></button>
      </form>
      <div class="auth-footer"><a href="/accounts/login/" data-i18n="auth_back_to_login">Back to Login</a></div>
    </div>
    <script src="{% static 'js/auth_i18n.js' %}"></script>
  </body>
</html>
