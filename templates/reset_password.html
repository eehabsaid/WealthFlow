{% load static %}
<!doctype html>
<html lang="{{ lang_code|default:'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="auth_reset_password_page_title">Reset Password - WealthFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
      :root { --bg-primary:#070d1f; --bg-secondary:#0c1428; --bg-tertiary:#101c38; --border-color:#1a3460; --accent:#1a6ef5; --accent-hover:#3381ff; --accent-glow:rgba(26,110,245,.25); --text-primary:#dce8ff; --text-secondary:#7b97cc; --text-muted:#3f5a8a; --accent-red:#ff4d6d; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { background:var(--bg-primary); color:var(--text-primary); font-family:"Segoe UI",system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
      .auth-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:16px; padding:40px 36px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
      .auth-lang { display:flex; justify-content:flex-end; margin-bottom:18px; }
      .auth-lang select, .form-control { background:var(--bg-tertiary); border:1px solid var(--border-color); color:var(--text-primary); border-radius:8px; }
      .auth-lang select { padding:8px 12px; font-size:13px; }
      .auth-logo { text-align:center; margin-bottom:28px; }
      .auth-logo .logo-icon { width:56px; height:56px; background:linear-gradient(135deg,var(--accent),#0f45c8); border-radius:14px; display:inline-flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:12px; box-shadow:0 0 20px var(--accent-glow); }
      .auth-logo h1 { font-size:20px; font-weight:700; margin-bottom:4px; }
      .auth-logo p { font-size:13px; color:var(--text-muted); }
      .form-label { font-size:12px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
      .form-control { padding:10px 14px; font-size:14px; }
      .btn-submit { width:100%; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:11px; font-size:14px; font-weight:700; margin-top:8px; }
      .btn-submit:hover { background:var(--accent-hover); box-shadow:0 0 16px var(--accent-glow); }
      .alert-dark-danger { background:rgba(255,77,109,.1); border:1px solid rgba(255,77,109,.35); color:#ff8099; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:18px; display:flex; align-items:center; gap:8px; }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-lang"><select id="authLanguageSelect" aria-label="Language selector"><option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div>
      <div class="auth-logo"><div class="logo-icon">💰</div><h1 data-i18n="auth_reset_password_heading">Reset Password</h1><p data-i18n="auth_reset_password_subtitle">Choose a new password for your account.</p></div>
      {% if error_key %}<div class="alert-dark-danger"><i class="bi bi-exclamation-circle"></i><span data-i18n="{{ error_key }}">{{ error_key }}</span></div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="lang" value="{{ lang_code|default:'en' }}" class="lang-hidden-input" />
        <label class="form-label" data-i18n="auth_password_label">Password</label>
        <input type="password" name="password" class="form-control" data-i18n-placeholder="auth_signup_password_placeholder" placeholder="At least 8 characters" required />
        <label class="form-label" style="margin-top:16px" data-i18n="auth_confirm_password_label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" data-i18n-placeholder="auth_confirm_password_placeholder" placeholder="Repeat password" required />
        <button type="submit" class="btn-submit"><i class="bi bi-shield-lock"></i> <span data-i18n="auth_reset_password_button">Reset Password</span></button>
      </form>
    </div>
    <script src="{% static 'js/auth_i18n.js' %}"></script>
  </body>
</html>
