{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="{{ theme_color }}">
    <title>WealthFlow</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #0a0f1e; color: #e8f0fe; font-family: system-ui, sans-serif; text-align: center; }
        main { padding: 24px; max-width: 360px; }
        img { width: 96px; height: 96px; border-radius: 22px; }
        h1 { font-size: 1.4rem; margin: 20px 0 8px; }
        p { color: #9fb3d9; line-height: 1.5; }
        button { margin-top: 16px; padding: 10px 24px; border: 0; border-radius: 8px;
                 background: #1a6ef5; color: #fff; font-size: 1rem; }
    </style>
</head>
<body>
<main>
    <img src="{% static 'images/pwa/icon-192.png' %}" alt="WealthFlow">
    <h1 data-i18n="pwa_offline_title">You are offline</h1>
    <p data-i18n="pwa_offline_message">WealthFlow needs an internet connection to load your financial data. Check your connection and try again.</p>
    <button type="button" id="pwa-offline-retry" data-i18n="pwa_offline_retry">Try again</button>
</main>
<script src="{% static 'js/pwa/offline.js' %}"></script>
</body>
</html>
