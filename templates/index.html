{% load static %}
<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Salary &amp; Balance Tracker</title>
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
</head>
<body>

<div id=\"app\">
    <div id="sidebarOverlay" onclick="closeMobileSidebar()"></div>
    <nav id="sidebar"></nav>

    <div id="page-wrapper">
        <header id="topbar">
            <button id="mobile-nav-trigger" class="btn text-light d-lg-none p-2 me-2" onclick="toggleMobileSidebar()" style="font-size: 20px; border: none; background: transparent;">
                <i class="bi bi-list"></i>
            </button>
            <!-- Notification Bell -->
            <button id="notif-bell" onclick="navigate('notifications')"
                style="background:none;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer;position:relative;padding:4px 8px;margin-left:auto"
                title="Notifications">
                <i class="bi bi-bell"></i>
                <span id="notif-badge" style="display:none;position:absolute;top:0;right:0;background:var(--accent-danger);color:#fff;border-radius:50%;font-size:10px;font-weight:700;width:16px;height:16px;line-height:16px;text-align:center"></span>
            </button>
        </header>
        <main id="main-content">
            <div class="spinner-overlay">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </main>
    </div>
</div>

<!-- Global modal mount point -->
<div id="modal-container"></div>

<!-- Toast notifications -->
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="{% static 'js/i18n.js' %}"></script>
<script src="{% static 'js/reports.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>
<script src="{% static 'js/companies.js' %}"></script>
<script src="{% static 'js/salary.js' %}"></script>
<script src="{% static 'js/balance.js' %}"></script>
<script src="{% static 'js/settings.js' %}"></script>
<script src="{% static 'js/bank_certificates.js' %}"></script>
<script src="{% static 'js/exchange_rates.js' %}"></script>
<script src="{% static 'js/gold_price.js' %}"></script>
<script src="{% static 'js/expenses.js' %}"></script>
<script src="{% static 'js/notifications.js' %}"></script>
<script src="{% static 'js/audit_log.js' %}"></script>
<script src="{% static 'js/profile.js' %}"></script>
<script src="{% static 'js/advanced_reports.js' %}"></script>
<script src="{% static 'js/settings_extensions.js' %}"></script>
</body>
</html>
