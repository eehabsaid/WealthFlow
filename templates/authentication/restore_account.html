{% load static %}
<!doctype html>
<html lang="{{ lang_code|default:'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="auth_restore_page_title">Restore account - WealthFlow</title>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" />
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet" />
    <link href="{% static 'css/authentication/auth/index.css' %}" rel="stylesheet" />
    <link href="{% static 'css/authentication/forms.css' %}" rel="stylesheet" />
    <link href="{% static 'css/authentication/animations.css' %}" rel="stylesheet" />
    <link href="{% static 'css/authentication/responsive.css' %}" rel="stylesheet" />
  </head>
  <body class="auth-page">
    <div class="auth-card" si-modern-card id="restoreAccountCard">
      <div class="auth-lang">
        <select id="authLanguageSelect" aria-label="Language selector">
          <option value="en">English</option>
          <option value="ar">العربية</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
        <button class="icon-btn" id="theme-toggle" type="button" onclick="WFAuth.toggleTheme()" aria-label="Toggle theme">🌙</button>
      </div>

      <div id="restoreContent">
        <div class="auth-logo">
          <div class="logo-icon">
            <svg width="34" height="34" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="16" cy="16" r="14" stroke="url(#wfLogoGradRestore)" stroke-width="2.5" fill="rgba(37, 99, 235, 0.12)"/>
              <path d="M9 21L14 14.5L17.5 17.5L23 10.5" stroke="url(#wfLogoGradRestore)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="23" cy="10.5" r="2" fill="#3b82f6"/>
              <defs>
                <linearGradient id="wfLogoGradRestore" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#3b82f6"/>
                  <stop offset="1" stop-color="#8b5cf6"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h1 data-i18n="auth_restore_heading">Restore your account</h1>
          <p data-i18n="auth_restore_subtitle">Enter your username and password to cancel the deletion.</p>
        </div>

        {% if error_key %}
        <div class="alert-dark-danger" role="alert">
          <i class="bi bi-exclamation-circle"></i>
          <span data-i18n="{{ error_key }}">{{ error_key }}</span>
        </div>
        {% endif %}

        {% if success_key %}
        <div class="alert-dark-success" role="alert">
          <i class="bi bi-check-circle"></i>
          <span data-i18n="{{ success_key }}">{{ success_key }}</span>
        </div>
        {% endif %}

        <form method="post" id="restoreForm">
          {% csrf_token %}
          <input type="hidden" name="lang" value="{{ lang_code|default:'en' }}" class="lang-hidden-input" />
          <div class="mb-form">
            <label class="form-label" for="restoreUsernameInput" data-i18n="auth_username_label">Username</label>
            <input type="text" name="username" id="restoreUsernameInput" class="form-control" value="{{ prefill_username|default:'' }}" autocomplete="username" required tabindex="1" />
          </div>
          <div class="mb-form">
            <label class="form-label" for="restorePasswordInput" data-i18n="auth_password_label">Password</label>
            <input type="password" name="password" id="restorePasswordInput" class="form-control" autocomplete="current-password" required tabindex="2" />
          </div>
          <button type="submit" class="btn-submit" tabindex="3">
            <i class="bi bi-arrow-counterclockwise"></i>
            <span data-i18n="auth_restore_button">Restore my account</span>
          </button>
        </form>

        <div class="auth-footer" style="margin-top: 18px">
          <a href="/accounts/forgot-password/" id="restoreForgotLink" data-i18n="auth_forgot_password_button" tabindex="4">Forgot Password</a>
          &middot;
          <a href="/accounts/login/" data-i18n="auth_back_to_login" tabindex="5">Back to Login</a>
        </div>
      </div>
    </div>
    <script src="{% static 'js/authentication/shared/csrf_lang.js' %}"></script>
    <script src="{% static 'js/authentication/shared/theme.js' %}"></script>
    <script src="{% static 'js/authentication/shared/ui_helpers.js' %}"></script>
    <script src="{% static 'js/authentication/shared/bootstrap.js' %}"></script>
    <script src="{% static 'js/authentication/restore_account.js' %}"></script>
  </body>
</html>
