{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Management — Salary Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="{% static 'css/main.css' %}" rel="stylesheet" />
  </head>
  <body
    style="
      background: var(--bg-primary, #070d1f);
      color: var(--text-primary, #dce8ff);
      font-family: &quot;Segoe UI&quot;, system-ui, sans-serif;
      min-height: 100vh;
    "
  >
    <!-- Top bar -->
    <header
      style="
        height: 58px;
        background: var(--bg-secondary, #0c1428);
        border-bottom: 1px solid var(--border-color, #1a3460);
        display: flex;
        align-items: center;
        padding: 0 24px;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      "
    >
      <div style="display: flex; align-items: center; gap: 12px">
        <a
          href="/"
          style="
            color: var(--text-muted, #3f5a8a);
            text-decoration: none;
            font-size: 20px;
          "
        >
          <i class="bi bi-arrow-left"></i>
        </a>
        <div style="font-weight: 700; font-size: 16px">
          <i
            class="bi bi-people"
            style="color: var(--accent-primary, #1a6ef5); margin-right: 8px"
          ></i>
          User Management
        </div>
      </div>
      <div style="font-size: 13px; color: var(--text-muted, #3f5a8a)">
        <i
          class="bi bi-shield-lock"
          style="color: var(--accent-primary, #1a6ef5)"
        ></i>
        Admin only
      </div>
    </header>

    <div style="padding: 28px; max-width: 1100px; margin: 0 auto">
      <!-- Search + page size -->
      <div
        style="
          display: flex;
          gap: 12px;
          flex-wrap: wrap;
          margin-bottom: 20px;
          align-items: center;
        "
      >
        <div style="position: relative; flex: 1; min-width: 220px">
          <i
            class="bi bi-search"
            style="
              position: absolute;
              left: 12px;
              top: 50%;
              transform: translateY(-50%);
              color: var(--text-muted, #3f5a8a);
            "
          ></i>
          <input
            id="search"
            placeholder="Search username or email..."
            style="
              width: 100%;
              background: var(--bg-tertiary, #101c38);
              border: 1px solid var(--border-color, #1a3460);
              color: var(--text-primary, #dce8ff);
              border-radius: 8px;
              padding: 9px 12px 9px 36px;
              font-size: 13px;
              outline: none;
            "
            oninput="filterUsers()"
          />
        </div>
        <select
          id="page-size"
          onchange="changePageSize()"
          style="
            background: var(--bg-tertiary, #101c38);
            border: 1px solid var(--border-color, #1a3460);
            color: var(--text-primary, #dce8ff);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 13px;
            cursor: pointer;
          "
        >
          <option value="10">10 per page</option>
          <option value="25">25 per page</option>
          <option value="50">50 per page</option>
        </select>
      </div>

      <!-- Users table -->
      <div
        style="
          background: var(--bg-secondary, #0c1428);
          border: 1px solid var(--border-color, #1a3460);
          border-radius: 12px;
          overflow: hidden;
        "
      >
        <table class="data-table" id="users-table" style="min-width: 600px">
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th class="text-center">Active</th>
              <th class="text-center">Staff</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td
                colspan="5"
                style="
                  text-align: center;
                  padding: 40px;
                  color: var(--text-muted);
                "
              >
                <div
                  class="spinner-border spinner-border-sm text-primary"
                ></div>
                Loading...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 14px;
          font-size: 13px;
          color: var(--text-muted, #3f5a8a);
        "
      >
        <div id="pagination-info"></div>
        <div style="display: flex; align-items: center; gap: 8px">
          <button
            id="prev-page"
            onclick="prevPage()"
            style="
              background: var(--bg-tertiary, #101c38);
              border: 1px solid var(--border-color, #1a3460);
              color: var(--text-secondary, #7b97cc);
              border-radius: 6px;
              padding: 5px 14px;
              cursor: pointer;
              font-size: 13px;
            "
          >
            <i class="bi bi-chevron-left"></i> Prev
          </button>
          <span
            id="current-page"
            style="
              background: var(--accent-primary, #1a6ef5);
              color: #fff;
              border-radius: 6px;
              padding: 5px 12px;
              font-weight: 700;
            "
            >1</span
          >
          <button
            id="next-page"
            onclick="nextPage()"
            style="
              background: var(--bg-tertiary, #101c38);
              border: 1px solid var(--border-color, #1a3460);
              color: var(--text-secondary, #7b97cc);
              border-radius: 6px;
              padding: 5px 14px;
              cursor: pointer;
              font-size: 13px;
            "
          >
            Next <i class="bi bi-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Permissions Modal (dark themed) -->
    <div class="modal fade modal-dark" id="permissionsModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i
                class="bi bi-shield-check"
                style="color: var(--accent-primary, #1a6ef5); margin-right: 8px"
              ></i
              >Manage Permissions
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div
              id="perm-list"
              class="mb-3"
              style="min-height: 40px; display: flex; flex-wrap: wrap; gap: 6px"
            ></div>
            <div style="display: flex; gap: 8px; margin-top: 12px">
              <select
                id="perm-select"
                style="
                  flex: 1;
                  background: var(--bg-tertiary, #101c38);
                  border: 1px solid var(--border-color, #1a3460);
                  color: var(--text-primary, #dce8ff);
                  border-radius: 8px;
                  padding: 8px 12px;
                  font-size: 13px;
                "
              ></select>
              <button
                id="perm-add"
                onclick="addPermission()"
                style="
                  background: var(--accent-primary, #1a6ef5);
                  color: #fff;
                  border: none;
                  border-radius: 8px;
                  padding: 8px 18px;
                  font-size: 13px;
                  font-weight: 600;
                  cursor: pointer;
                "
              >
                <i class="bi bi-plus-lg"></i> Add
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/user_management.js' %}"></script>
  </body>
</html>
