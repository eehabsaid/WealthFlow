{% load static %}
<!doctype html>
<html lang="{{ lang_code|default:'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="{{ title_key }}">WealthFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root { --bg-primary:#070d1f; --bg-secondary:#0c1428; --bg-tertiary:#101c38; --border-color:#1a3460; --accent:#1a6ef5; --accent-hover:#3381ff; --accent-glow:rgba(26,110,245,.25); --text-primary:#dce8ff; --text-secondary:#7b97cc; --text-muted:#3f5a8a; --accent-red:#ff4d6d; --accent-green:#00d68f; }
      body { background:var(--bg-primary); color:var(--text-primary); font-family:"Segoe UI",system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
      .auth-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:16px; padding:40px 36px; width:100%; max-width:520px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
      .auth-lang { display:flex; justify-content:flex-end; margin-bottom:18px; }
      .auth-lang select { background:var(--bg-tertiary); border:1px solid var(--border-color); color:var(--text-primary); border-radius:8px; padding:8px 12px; font-size:13px; }
      .auth-logo { text-align:center; margin-bottom:20px; }
      .auth-logo .logo-icon { width:56px; height:56px; background:linear-gradient(135deg,var(--accent),#0f45c8); border-radius:14px; display:inline-flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:12px; box-shadow:0 0 20px var(--accent-glow); }
      .auth-logo h1 { font-size:22px; font-weight:700; margin-bottom:12px; }
      .status-box { border-radius:12px; padding:18px; border:1px solid var(--border-color); background:var(--bg-tertiary); color:var(--text-primary); line-height:1.7; text-align:center; }
      .status-box.success { border-color:rgba(0,214,143,.45); }
      .status-box.danger { border-color:rgba(255,77,109,.45); }
      .btn-submit { display:inline-block; margin-top:20px; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:11px 18px; font-size:14px; font-weight:700; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-lang"><select id="authLanguageSelect" aria-label="Language selector"><option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div>
      <div class="auth-logo"><div class="logo-icon">💰</div><h1 data-i18n="{{ title_key }}">{{ title_key }}</h1></div>
      <div class="status-box {{ tone|default:'info' }}"><span data-i18n="{{ message_key }}">{{ message_key }}</span></div>
      {% if cta_href and cta_key %}<div style="text-align:center"><a class="btn-submit" href="{{ cta_href }}" data-i18n="{{ cta_key }}">{{ cta_key }}</a></div>{% endif %}
    </div>
    <script src="{% static 'js/auth_i18n.js' %}"></script>
  </body>
</html>
