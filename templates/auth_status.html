{% load static %}
<!doctype html>
<html lang="{{ lang_code|default:'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="{{ title_key }}">WealthFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="{% static 'css/authentication/auth.css' %}" rel="stylesheet" />
    <link href="{% static 'css/authentication/forms.css' %}" rel="stylesheet" />
    <link href="{% static 'css/authentication/animations.css' %}" rel="stylesheet" />
    <link href="{% static 'css/authentication/responsive.css' %}" rel="stylesheet" />
    <style>
      .status-box {
        border-radius: 12px;
        padding: 20px;
        border: 1px solid var(--wf-auth-border);
        background: var(--wf-auth-bg-tertiary);
        color: var(--wf-auth-text-primary);
        line-height: 1.7;
        text-align: center;
        margin-top: 12px;
      }
      .status-box.success {
        border-color: var(--wf-auth-green-border);
        background: var(--wf-auth-green-bg);
      }
      .status-box.danger {
        border-color: var(--wf-auth-red-border);
        background: var(--wf-auth-red-bg);
      }
    </style>
  </head>
  <body class="auth-page">
    <div class="auth-card" style="max-width: 520px" si-modern-card>
      <div class="auth-lang">
        <select id="authLanguageSelect" aria-label="Language selector">
          <option value="en">English</option>
          <option value="ar">العربية</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
        <button class="icon-btn" id="theme-toggle" type="button" onclick="WFAuth.toggleTheme()" aria-label="Toggle theme">🌙</button>
      </div>
      <div class="auth-logo">
        <div class="logo-icon">
          <svg width="34" height="34" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" stroke="url(#wfLogoGradStatus)" stroke-width="2.5" fill="rgba(37, 99, 235, 0.12)"/>
            <path d="M9 21L14 14.5L17.5 17.5L23 10.5" stroke="url(#wfLogoGradStatus)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="23" cy="10.5" r="2" fill="#3b82f6"/>
            <defs>
              <linearGradient id="wfLogoGradStatus" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop stop-color="#3b82f6"/>
                <stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 data-i18n="{{ title_key }}">{{ title_key }}</h1>
      </div>
      <div class="status-box {{ tone|default:'info' }}">
        <span data-i18n="{{ message_key }}">{{ message_key }}</span>
      </div>
      {% if cta_href and cta_key %}
      <div style="text-align: center">
        <a class="btn-submit" href="{{ cta_href }}" data-i18n="{{ cta_key }}" style="text-decoration: none; margin-top: 24px; display: inline-flex;">{{ cta_key }}</a>
      </div>
      {% endif %}
    </div>
    <script src="{% static 'js/authentication/shared.js' %}"></script>
  </body>
</html>
