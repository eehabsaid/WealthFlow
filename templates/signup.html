{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up — Salary Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #070d1f;
        --bg-secondary: #0c1428;
        --bg-tertiary: #101c38;
        --border-color: #1a3460;
        --accent: #1a6ef5;
        --accent-hover: #3381ff;
        --accent-glow: rgba(26, 110, 245, 0.25);
        --text-primary: #dce8ff;
        --text-secondary: #7b97cc;
        --text-muted: #3f5a8a;
        --accent-red: #ff4d6d;
        --accent-green: #00d68f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .auth-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 40px 36px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .auth-logo {
        text-align: center;
        margin-bottom: 28px;
      }
      .auth-logo .logo-icon {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, var(--accent), #0f45c8);
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin-bottom: 12px;
        box-shadow: 0 0 20px var(--accent-glow);
      }
      .auth-logo h1 {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 4px;
      }
      .auth-logo p {
        font-size: 13px;
        color: var(--text-muted);
      }
      .form-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .form-control {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .form-control::placeholder {
        color: var(--text-muted);
      }
      .form-control:focus {
        background: var(--bg-tertiary);
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
        color: var(--text-primary);
        outline: none;
      }
      .input-group .form-control {
        border-radius: 8px 0 0 8px;
      }
      .input-group .btn-eye {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-left: none;
        color: var(--text-muted);
        border-radius: 0 8px 8px 0;
        padding: 0 14px;
        cursor: pointer;
      }
      .input-group .btn-eye:hover {
        color: var(--text-primary);
      }
      .btn-submit {
        width: 100%;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.15s,
          box-shadow 0.15s;
        margin-top: 8px;
      }
      .btn-submit:hover {
        background: var(--accent-hover);
        box-shadow: 0 0 16px var(--accent-glow);
      }
      .auth-divider {
        border: none;
        border-top: 1px solid var(--border-color);
        margin: 24px 0;
      }
      .auth-footer {
        text-align: center;
        font-size: 13px;
        color: var(--text-muted);
      }
      .auth-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .auth-footer a:hover {
        color: var(--accent-hover);
      }
      .alert-dark-danger {
        background: rgba(255, 77, 109, 0.1);
        border: 1px solid rgba(255, 77, 109, 0.35);
        color: #ff8099;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mb-form {
        margin-bottom: 16px;
      }
      .optional-tag {
        font-size: 10px;
        color: var(--text-muted);
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        margin-left: 6px;
      }
      .strength-bar {
        height: 3px;
        border-radius: 2px;
        background: var(--bg-tertiary);
        margin-top: 6px;
        overflow: hidden;
      }
      .strength-fill {
        height: 100%;
        width: 0;
        transition:
          width 0.3s,
          background 0.3s;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">💰</div>
        <h1>Create Account</h1>
        <p>Join Salary &amp; Balance Tracker</p>
      </div>

      {% if error %}
      <div class="alert-dark-danger">
        <i class="bi bi-exclamation-circle"></i> {{ error }}
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-form">
          <label class="form-label">
            Full Name <span class="optional-tag">(optional)</span>
          </label>
          <input
            type="text"
            name="full_name"
            class="form-control"
            placeholder="e.g. Ehab Mohamed"
          />
        </div>

        <div class="mb-form">
          <label class="form-label">Username</label>
          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Choose a username"
            required
          />
        </div>

        <div class="mb-form">
          <label class="form-label">Email</label>
          <input
            type="email"
            name="email"
            class="form-control"
            placeholder="your@email.com"
            required
          />
        </div>

        <div class="mb-form">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input
              type="password"
              name="password"
              id="pw1"
              class="form-control"
              placeholder="At least 8 characters"
              required
              oninput="checkStrength(this.value)"
            />
            <button
              type="button"
              class="btn-eye"
              onclick="togglePw('pw1', 'eye1')"
            >
              <i class="bi bi-eye" id="eye1"></i>
            </button>
          </div>
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
        </div>

        <div class="mb-form">
          <label class="form-label">Confirm Password</label>
          <div class="input-group">
            <input
              type="password"
              name="confirm_password"
              id="pw2"
              class="form-control"
              placeholder="Repeat password"
              required
            />
            <button
              type="button"
              class="btn-eye"
              onclick="togglePw('pw2', 'eye2')"
            >
              <i class="bi bi-eye" id="eye2"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <i class="bi bi-person-plus"></i> Create Account
        </button>
      </form>

      <hr class="auth-divider" />
      <div class="auth-footer">
        Already have an account? <a href="/accounts/login/">Sign in</a>
      </div>
    </div>

    <script>
      function togglePw(id, iconId) {
        const inp = document.getElementById(id);
        const icon = document.getElementById(iconId);
        inp.type = inp.type === "password" ? "text" : "password";
        icon.className = inp.type === "text" ? "bi bi-eye-slash" : "bi bi-eye";
      }
      function checkStrength(pw) {
        const fill = document.getElementById("strengthFill");
        let score = 0;
        if (pw.length >= 8) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        const widths = ["0%", "25%", "50%", "75%", "100%"];
        const colors = ["#ff4d6d", "#ff4d6d", "#ffd166", "#ffd166", "#00d68f"];
        fill.style.width = widths[score];
        fill.style.background = colors[score];
      }
    </script>
  </body>
</html>
