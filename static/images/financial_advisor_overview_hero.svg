<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent-primary)" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="var(--accent-primary)" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="barGradBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d7fff"/>
      <stop offset="100%" stop-color="#1a6ef5"/>
    </linearGradient>
    <linearGradient id="barGradGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffb2"/>
      <stop offset="100%" stop-color="#00d68f"/>
    </linearGradient>
    <linearGradient id="barGradPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b178ff"/>
      <stop offset="100%" stop-color="#8c7cf0"/>
    </linearGradient>
  </defs>
  <!-- Background Circle Grid -->
  <circle cx="100" cy="100" r="90" fill="var(--bg-secondary)" stroke="var(--border-color)" stroke-width="1.5" />
  <g opacity="0.08">
    <line x1="40" y1="60" x2="160" y2="60" stroke="var(--text-primary)" stroke-width="1"/>
    <line x1="40" y1="80" x2="160" y2="80" stroke="var(--text-primary)" stroke-width="1"/>
    <line x1="40" y1="100" x2="160" y2="100" stroke="var(--text-primary)" stroke-width="1"/>
    <line x1="40" y1="120" x2="160" y2="120" stroke="var(--text-primary)" stroke-width="1"/>
    <line x1="40" y1="140" x2="160" y2="140" stroke="var(--text-primary)" stroke-width="1"/>
    
    <line x1="60" y1="40" x2="60" y2="160" stroke="var(--text-primary)" stroke-width="1"/>
    <line x1="80" y1="40" x2="80" y2="160" stroke="var(--text-primary)" stroke-width="1"/>
    <line x1="100" y1="40" x2="100" y2="160" stroke="var(--text-primary)" stroke-width="1"/>
    <line x1="120" y1="40" x2="120" y2="160" stroke="var(--text-primary)" stroke-width="1"/>
    <line x1="140" y1="40" x2="140" y2="160" stroke="var(--text-primary)" stroke-width="1"/>
  </g>

  <!-- Area Fill under Sparkline -->
  <path d="M40,140 L40,120 Q70,90 100,105 T160,70 L160,140 Z" fill="url(#chartGrad)" />

  <!-- 3D Isometric Bar Chart Group -->
  <g transform="translate(5, 5)">
    <!-- Bar 1 (Left, Blue) -->
    <path d="M45,130 L60,130 L60,95 L45,95 Z" fill="url(#barGradBlue)" />
    <path d="M60,95 L70,87 L70,122 L60,130 Z" fill="#1558c4" />
    <path d="M45,95 L55,87 L70,87 L60,95 Z" fill="#5da9ff" />

    <!-- Bar 2 (Center, Green) -->
    <path d="M75,130 L90,130 L90,65 L75,65 Z" fill="url(#barGradGreen)" />
    <path d="M90,65 L100,57 L100,122 L90,130 Z" fill="#00a86b" />
    <path d="M75,65 L85,57 L100,57 L90,65 Z" fill="#50d890" />

    <!-- Bar 3 (Right, Purple) -->
    <path d="M105,130 L120,130 L120,80 L105,80 Z" fill="url(#barGradPurple)" />
    <path d="M120,80 L130,72 L130,122 L120,130 Z" fill="#7564d6" />
    <path d="M105,80 L115,72 L130,72 L120,80 Z" fill="#b178ff" />
  </g>

  <!-- Sparkline curve representing growth -->
  <path d="M40,120 Q70,90 100,105 T160,70" fill="none" stroke="var(--accent-primary)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Outer Glow dot at the end of the line -->
  <circle cx="160" cy="70" r="7" fill="var(--accent-primary)" opacity="0.3" />
  <circle cx="160" cy="70" r="3.5" fill="var(--text-primary)" />
</svg>
