<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WealthFlow logo">
  <defs>
    <linearGradient id="wfBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wfLine" x1="120" y1="392" x2="400" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="wfCoin" x1="352" y1="96" x2="416" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="wfGlow" cx="0.5" cy="0.35" r="0.75">
      <stop stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#wfBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#wfGlow)"/>
  <rect x="32" y="32" width="448" height="448" rx="96" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Rising flow line -->
  <path d="M112 372 L212 272 L272 332 L384 200"
        stroke="url(#wfLine)" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow tip -->
  <path d="M330 196 L392 188 L384 250"
        stroke="url(#wfLine)" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Coin accent -->
  <circle cx="384" cy="128" r="44" fill="url(#wfCoin)"/>
  <circle cx="384" cy="128" r="44" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
  <path d="M384 104 V152 M370 116 C370 108 376 104 384 104 C392 104 398 108 398 116 C398 126 370 126 370 136 C370 144 376 148 384 148 C392 148 398 144 398 136"
        stroke="#7c2d12" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
