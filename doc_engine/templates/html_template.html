<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --accent-primary: #0d6efd;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #212529;
                --bg-secondary: #343a40;
                --text-primary: #f8f9fa;
                --text-secondary: #adb5bd;
                --border-color: #495057;
                --accent-primary: #0d6efd;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        h1 {
            font-size: 2.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            page-break-after: avoid;
        }

        h2 {
            font-size: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            page-break-before: always;
        }

        p {
            margin-bottom: 1em;
        }

        img {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        code {
            background-color: var(--bg-secondary);
            padding: 2px 4px;
            border-radius: 4px;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875em;
            color: var(--accent-primary);
        }

        hr {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 2em 0;
            page-break-after: always;
        }

        a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .toc {
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
        }

        .toc h2 {
            page-break-before: auto;
            margin-top: 0;
            border-bottom: none;
        }

        @media print {
            body {
                background-color: #fff;
                color: #000;
                padding: 0;
            }
            .container {
                max-width: 100%;
            }
            a {
                color: #000;
                text-decoration: none;
            }
            img {
                box-shadow: none;
                page-break-inside: avoid;
            }
            @page {
                margin: 20mm;
            }
            hr {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        {{ content }}
    </div>
</body>
</html>
