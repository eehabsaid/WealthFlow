[project]
name = "ai-app"
version = "1.0"
description = "Copy-in Django AI app (chat, settings, providers, agent). Dependencies are minimum ranges only."
requires-python = ">=3.10"
dependencies = ["Django>=4.2", "requests>=2.28", "cryptography>=41"]

[project.optional-dependencies]
exports = ["openpyxl>=3.1", "reportlab>=4.0", "python-docx>=1.0", "pypdf>=4.0", "Pillow>=10.0"]
browser = ["playwright>=1.40"]
